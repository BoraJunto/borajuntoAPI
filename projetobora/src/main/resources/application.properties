spring.datasource.url=jdbc:mysql://localhost:3306/borajunto?useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Application name
spring.application.name=BoraJunto API
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.borajunto=DEBUG

# Security
jwt.secret=sua_chave_secreta_muito_segura_aqui_minimo_32_caracteres
jwt.expiration=86400000



